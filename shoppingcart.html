
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - Soof's Wear Apparel</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <!-- Sufyan Khan: HTML structure, Bootstrap layout, product selection, shopping cart table, checkout layout, navigation, and shopping cart icon -->

    <header class="store-header">
        <h1>Soof's Wear Apparel</h1>
        <p>Style that fits you. Quality that lasts.</p>

        <a href="shoppingcart.html" class="cart-icon"
           aria-label="Shopping Cart">
            <i class="bi bi-cart3"></i>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#shop">Shop</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
            <a href="signup.html">Sign Up</a>
            <a href="product.html">Product Management</a>
        </nav>
    </header>

    <main class="shopping-cart-page">

        <h2 class="text-center mb-4">Shopping Cart</h2>

        <section class="cart-selection mb-4">
            <label for="productSelect" class="form-label">
                Select a Product
            </label>

            <select id="productSelect" class="form-select mb-3">
                <option value="">-- Select a Product --</option>
            </select>

            <button id="addProductBtn" type="button"
                    class="btn btn-primary">
                Add Product
            </button>

            <p id="cartMessage" class="mt-3" aria-live="polite"></p>
        </section>

        <section class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
                <thead>
                    <tr>
                        <th>Product ID</th>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="cartTableBody"></tbody>

                <tfoot>
                    <tr>
                        <td colspan="4" class="text-end">
                            <strong>Cart Total:</strong>
                        </td>
                        <td colspan="2">
                            <strong id="cartTotal">$0.00</strong>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </section>

        <section class="checkout-section mt-4">
            <button id="checkoutBtn" type="button"
                    class="btn btn-success">
                Checkout
            </button>

            <p id="checkoutMessage" class="mt-3" aria-live="polite"></p>
        </section>

        <section class="cart-json-section mt-4">
            <h3>Shopping Cart JSON Document</h3>
            <pre id="cartJsonOutput" class="json-output"></pre>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Soof's Wear Apparel</p>
    </footer>

    <!-- Zuhan Kabeer: JavaScript quantity validation, quantity updates, product removal, and shopping cart total calculations. CSS styling and responsive design are implemented in style.css. -->

    <script>
        const CART_STORAGE_KEY = "soofsShoppingCart";

        function readStoredArray(key) {
            try {
                const value = JSON.parse(
                    localStorage.getItem(key) || "[]"
                );

                return Array.isArray(value) ? value : [];
            } catch (error) {
                return [];
            }
        }

        let cart = readStoredArray(CART_STORAGE_KEY);

        function saveCart() {
            localStorage.setItem(
                CART_STORAGE_KEY,
                JSON.stringify(cart)
            );
        }

        function formatMoney(amount) {
            return "$" + Number(amount).toFixed(2);
        }

        function calculateCartTotal() {
            let total = 0;

            $.each(cart, function (index, item) {
                total += Number(item.price) * Number(item.quantity);
            });

            return total;
        }

        function updateQuantity(productID, quantity) {
            const newQuantity = Number(quantity);

            if (!Number.isInteger(newQuantity) || newQuantity < 1) {
                $("#cartMessage")
                    .text("Quantity must be a whole number of at least 1.")
                    .css("color", "red");

                displayCart();
                return;
            }

            $.each(cart, function (index, item) {
                if (item.productId === productID) {
                    item.quantity = newQuantity;
                }
            });

            saveCart();
            displayCart();
        }

        function removeProduct(productID) {
            cart = $.grep(cart, function (item) {
                return item.productId !== productID;
            });

            saveCart();
            displayCart();

            $("#cartMessage")
                .text("Product removed from the cart.")
                .css("color", "green");
        }

        function displayCart() {
            const tableBody = $("#cartTableBody");
            tableBody.empty();

            if (cart.length === 0) {
                const row = $("<tr>");

                $("<td>", {
                    colspan: 6,
                    text: "Your shopping cart is empty.",
                    class: "text-center"
                }).appendTo(row);

                tableBody.append(row);
            }

            $.each(cart, function (index, item) {
                const row = $("<tr>");

                $("<td>").text(item.productId).appendTo(row);
                $("<td>").text(item.productName).appendTo(row);
                $("<td>").text(formatMoney(item.price)).appendTo(row);

                const quantityInput = $("<input>", {
                    type: "number",
                    min: 1,
                    step: 1,
                    value: item.quantity,
                    class: "form-control cart-quantity",
                    "aria-label": "Quantity for " + item.productName
                });

                quantityInput.on("change", function () {
                    updateQuantity(item.productId, $(this).val());
                });

                $("<td>").append(quantityInput).appendTo(row);

                $("<td>")
                    .text(formatMoney(item.price * item.quantity))
                    .appendTo(row);

                const removeButton = $("<button>", {
                    type: "button",
                    text: "Remove",
                    class: "btn btn-danger btn-sm"
                });

                removeButton.on("click", function () {
                    removeProduct(item.productId);
                });

                $("<td>").append(removeButton).appendTo(row);

                tableBody.append(row);
            });

            $("#cartTotal").text(formatMoney(calculateCartTotal()));

            $("#cartJsonOutput").text("");
            $("#checkoutMessage").text("");
        }
    </script>

    <!-- Mousa Toure: jQuery product searching, adding products, localStorage integration, product validation, JSON generation, checkout behavior, and AJAX preparation -->

    <script>
        const PRODUCT_STORAGE_KEY = "soofsProducts";

        let products = readStoredArray(PRODUCT_STORAGE_KEY);

        function getProductID(product) {
            return String(
                product.productID ??
                product.productId ??
                product.ProductID ??
                ""
            );
        }

        function getProductName(product) {
            return String(
                product.productDescription ??
                product.description ??
                product.productName ??
                product.productDesc ??
                "Unnamed Product"
            );
        }

        function getProductPrice(product) {
            return Number(
                product.productPrice ??
                product.price ??
                product.ProductPrice ??
                0
            );
        }

        function findProduct(productID) {
            return $.grep(products, function (product) {
                return getProductID(product) === productID;
            })[0];
        }

        function loadProductDropdown() {
            products = readStoredArray(PRODUCT_STORAGE_KEY);

            $("#productSelect").empty();

            $("#productSelect").append(
                $("<option>", {
                    value: "",
                    text: "-- Select a Product --"
                })
            );

            $.each(products, function (index, product) {
                const productID = getProductID(product);

                if (productID) {
                    $("#productSelect").append(
                        $("<option>", {
                            value: productID,
                            text: getProductName(product)
                        })
                    );
                }
            });

            if (products.length === 0) {
                $("#cartMessage")
                    .text("No saved products found. Add products on the Product Management page first.")
                    .css("color", "#555");
            }
        }

        function addProductToCart() {
            const selectedID = $("#productSelect").val();

            if (!selectedID) {
                $("#cartMessage")
                    .text("Please select a product.")
                    .css("color", "red");
                return;
            }

            const selectedProduct = findProduct(selectedID);

            if (!selectedProduct) {
                $("#cartMessage")
                    .text("Product not found.")
                    .css("color", "red");
                return;
            }

            const price = getProductPrice(selectedProduct);

            if (!Number.isFinite(price) || price < 0) {
                $("#cartMessage")
                    .text("Invalid product price.")
                    .css("color", "red");
                return;
            }

            const existingItem = $.grep(cart, function (item) {
                return item.productId === selectedID;
            })[0];

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    productId: selectedID,
                    productName: getProductName(selectedProduct),
                    price: price,
                    quantity: 1
                });
            }

            saveCart();
            displayCart();

            $("#cartMessage")
                .text("Product added to cart.")
                .css("color", "green");
        }

        function createCartJSON() {
            const cartDocument = $.map(cart, function (item) {
                return {
                    productId: item.productId,
                    productName: item.productName,
                    price: item.price,
                    quantity: item.quantity,
                    total: Number(
                        (item.price * item.quantity).toFixed(2)
                    )
                };
            });

            return JSON.stringify(cartDocument, null, 2);
        }

        function sendCartToAPI(jsonDocument, apiURL) {
            return $.ajax({
                url: apiURL,
                type: "POST",
                contentType: "application/json",
                data: jsonDocument
            });
        }

        function checkout() {
            if (cart.length === 0) {
                $("#checkoutMessage")
                    .text("Add at least one product before checkout.")
                    .css("color", "red");
                return;
            }

            const jsonDocument = createCartJSON();

            $("#cartJsonOutput").text(jsonDocument);

            $("#checkoutMessage")
                .text("Shopping cart JSON document generated successfully.")
                .css("color", "green");

            // Future Node.js REST API integration:
            // sendCartToAPI(jsonDocument, "YOUR_NODEJS_API_URL");
        }

        $(document).ready(function () {
            loadProductDropdown();
            displayCart();

            $("#addProductBtn").on("click", addProductToCart);
            $("#checkoutBtn").on("click", checkout);
        });
    </script>

</body>
</html>
