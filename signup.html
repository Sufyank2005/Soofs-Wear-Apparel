<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Sign Up - Soof's Wear Apparel</title>

<!-- Bootstrap CSS CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- External CSS -->
<link rel="stylesheet" href="style.css">


</head>

<body>

<!-- HEADER -->
<header>
    <h1>Soof's Wear Apparel</h1>
    <p>Style that fits you. Quality that lasts.</p>

    <!-- NAVIGATION BAR -->
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
        <a href="signup.html">Sign Up</a>
    </nav>
</header>


<!-- MAIN CONTENT -->
<main>

    <section class="welcome">
        <h2>Create Your Account</h2>

        <p>
            Sign up for Soof's Wear Apparel.
        </p>
    </section>


    <!-- SIGN UP FORM -->
    <section class="container mb-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow p-4">

                    <h3 class="text-center mb-4">
                        User Sign-Up
                    </h3>

                    <form id="signupForm" onsubmit="return validateForm()">

                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                onfocusout="validate(this)">

                            <div id="usernameError" class="error-message"></div>
                        </div>


                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                onfocusout="validate(this)">

                            <div id="emailError" class="error-message"></div>
                        </div>


                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                onfocusout="validate(this)">

                            <div id="passwordError" class="error-message"></div>
                        </div>


                        <!-- Confirm Password -->
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                onfocusout="validate(this)">

                            <div id="confirmPasswordError" class="error-message"></div>
                        </div>


                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark">
                                Sign Up
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </section>

</main>


<!-- FOOTER -->
<footer>
    <p>
        &copy; 2026 Soof's Wear Apparel
    </p>
</footer>


<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- INTERNAL JAVASCRIPT -->
<script>

    // Validates an individual input field
    function validate(obj) {

        // Remove the previous error message
        let errorMessage = document.getElementById(obj.id + "Error");

        errorMessage.textContent = "";

        // Reset textbox color
        obj.style.color = "#222";

        // Username validation
        if (obj.id === "username") {

            if (obj.value.trim() === "") {
                obj.style.color = "#FF0000";
                errorMessage.textContent = "Username is required.";
                errorMessage.style.color = "#FF0000";
                return false;
            }
        }


        // Email validation
        if (obj.id === "email") {

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (obj.value.trim() === "") {
                obj.style.color = "#FF0000";
                errorMessage.textContent = "Email is required.";
                errorMessage.style.color = "#FF0000";
                return false;
            }

            if (!emailPattern.test(obj.value)) {
                obj.style.color = "#FF0000";
                errorMessage.textContent = "Please enter a valid email such as joe@test.com.";
                errorMessage.style.color = "#FF0000";
                return false;
            }
        }


        // Password validation
        if (obj.id === "password") {

            if (obj.value.trim() === "") {
                obj.style.color = "#FF0000";
                errorMessage.textContent = "Password is required.";
                errorMessage.style.color = "#FF0000";
                return false;
            }
        }


        // Confirm Password validation
        if (obj.id === "confirmPassword") {

            let password = document.getElementById("password").value;

            if (obj.value.trim() === "") {
                obj.style.color = "#FF0000";
                errorMessage.textContent = "Please confirm your password.";
                errorMessage.style.color = "#FF0000";
                return false;
            }

            if (obj.value !== password) {
                obj.style.color = "#FF0000";
                errorMessage.textContent = "Passwords do not match.";
                errorMessage.style.color = "#FF0000";
                return false;
            }
        }


        // Valid input
        obj.style.color = "#222";
        errorMessage.textContent = "";

        return true;
    }


    // Validates all fields when the form is submitted
    function validateForm() {

        let username = document.getElementById("username");
        let email = document.getElementById("email");
        let password = document.getElementById("password");
        let confirmPassword = document.getElementById("confirmPassword");

        let usernameValid = validate(username);
        let emailValid = validate(email);
        let passwordValid = validate(password);
        let confirmPasswordValid = validate(confirmPassword);

        // Prevent form submission if any field is invalid
        if (!usernameValid ||
            !emailValid ||
            !passwordValid ||
            !confirmPasswordValid) {

            return false;
        }

        // All fields are valid
        alert("Sign-up information is valid!");

        return false;
    }

</script>


</body>

</html>
