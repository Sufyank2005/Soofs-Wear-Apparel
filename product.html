
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Management - Soof's Wear Apparel</title>

    <!-- Bootstrap CSS: Sufyan Khan -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- External CSS: Zuhan Kabeer -->
    <link rel="stylesheet" href="style.css">

    <!-- jQuery Library: Mousa Toure -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<!-- HEADER -->
<header>
    <h1>Soof's Wear Apparel</h1>
    <p>Style that fits you. Quality that lasts.</p>

    <!-- NAVIGATION -->
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
        <a href="signup.html">Sign Up</a>
        <a href="product.html">Product Management</a>
    </nav>
</header>


<main class="product-page">

    <!-- HTML STRUCTURE AND BOOTSTRAP FORM: Sufyan Khan -->
    <section class="product-form-container">

        <h2>Product Management</h2>

        <form id="productForm">

            <!-- Product ID -->
            <div class="mb-3">
                <label for="productId" class="form-label">
                    Product ID:
                </label>

                <input type="text"
                       id="productId"
                       name="productId"
                       class="form-control"
                       required>
            </div>

            <!-- Product Description -->
            <div class="mb-3">
                <label for="productDesc" class="form-label">
                    Product Description:
                </label>

                <input type="text"
                       id="productDesc"
                       name="productDesc"
                       class="form-control"
                       required>
            </div>

            <!-- Product Category -->
            <div class="mb-3">
                <label for="productCategory" class="form-label">
                    Product Category:
                </label>

                <select id="productCategory"
                        name="productCategory"
                        class="form-select"
                        required>

                    <option value="">Select a category</option>
                    <option value="Men's Clothing">Men's Clothing</option>
                    <option value="Women's Clothing">Women's Clothing</option>
                    <option value="Accessories">Accessories</option>

                </select>
            </div>

            <!-- Product Unit of Measure -->
            <div class="mb-3">
                <label for="productUOM" class="form-label">
                    Product Unit of Measure:
                </label>

                <select id="productUOM"
                        name="productUOM"
                        class="form-select"
                        required>

                    <option value="">Select a unit</option>
                    <option value="Piece">Piece</option>
                    <option value="Pair">Pair</option>
                    <option value="Pack">Pack</option>

                </select>
            </div>

            <!-- Product Price -->
            <div class="mb-3">
                <label for="productPrice" class="form-label">
                    Product Price:
                </label>

                <input type="number"
                       id="productPrice"
                       name="productPrice"
                       class="form-control"
                       min="0"
                       step="0.01"
                       required>
            </div>

            <!-- Product Weight: Optional -->
            <div class="mb-3">
                <label for="productWeight" class="form-label">
                    Product Weight:
                </label>

                <input type="number"
                       id="productWeight"
                       name="productWeight"
                       class="form-control"
                       min="0"
                       step="any">
            </div>

            <button type="submit"
                    class="btn product-button w-100">
                Save
            </button>

        </form>

        <p id="formMessage" class="mt-3" role="status"></p>

    </section>


    <!-- JQUERY SEARCH: Mousa Toure -->
    <section class="product-search-section">

        <h2>Search Product</h2>

        <div class="mb-3">
            <label for="searchProductId" class="form-label">
                Product ID:
            </label>

            <input type="text"
                   id="searchProductId"
                   class="form-control">
        </div>

        <button type="button"
                id="searchButton"
                class="btn btn-outline-dark">
            Search
        </button>

        <h2 class="mt-4">Product Details</h2>

        <p id="searchMessage" role="status"></p>

        <!-- JSON PRODUCT DOCUMENT: Mousa Toure -->
        <h3>JSON</h3>

        <pre id="jsonOutput" class="json-output"></pre>

        <!-- JQUERY UPDATE: Mousa Toure -->
        <button type="button"
                id="updateButton"
                class="btn product-button w-100 mt-2">
            Update
        </button>

    </section>

</main>


<!-- FOOTER -->
<footer>
    <p>&copy; 2026 Soof's Wear Apparel</p>
</footer>


<!-- JAVASCRIPT AND JQUERY: Mousa Toure -->
<script>

    // Product data is stored in this browser.

    let products = [];

    // Load previously saved products.
    try {
        products = JSON.parse(
            localStorage.getItem("soofsProducts")
        ) || [];
    } catch (error) {
        products = [];
    }

    let selectedProductId = "";


    // Find a product using its Product ID.
    function findProduct(productId) {

        return products.find(function(product) {
            return product.productId === productId;
        });

    }


    // Get product information from the form.
    function getProductFromForm() {

        let product = {
            productId: $("#productId").val().trim(),
            productDesc: $("#productDesc").val().trim(),
            productCategory: $("#productCategory").val(),
            productUOM: $("#productUOM").val(),
            productPrice: Number($("#productPrice").val())
        };

        let weight = $("#productWeight").val().trim();

        // Only include weight when the user enters a value.
        if (weight !== "") {
            product.productWeight = Number(weight);
        }

        return product;

    }


    // Display a product as a formatted JSON document.
    function displayJSON(product) {

        $("#jsonOutput").text(
            JSON.stringify(product, null, 4)
        );

    }


    // Save product data in browser storage.
    function saveProducts() {

        try {
            localStorage.setItem(
                "soofsProducts",
                JSON.stringify(products)
            );

            return true;

        } catch (error) {

            $("#formMessage").text(
                "Unable to save product in browser storage."
            );

            return false;
        }

    }


    // Save a new product.
    $("#productForm").on("submit", function(event) {

        event.preventDefault();

        let product = getProductFromForm();

        // Check required fields.
        if (!this.checkValidity()) {
            this.reportValidity();
            return;
        }

        // Validate price.
        if (!Number.isFinite(product.productPrice) ||
            product.productPrice < 0) {

            $("#formMessage").text(
                "Please enter a valid product price."
            );

            return;
        }

        // Validate optional weight.
        if (product.productWeight !== undefined &&
            (!Number.isFinite(product.productWeight) ||
             product.productWeight < 0)) {

            $("#formMessage").text(
                "Please enter a valid product weight."
            );

            return;
        }

        // Prevent duplicate Product IDs.
        if (findProduct(product.productId)) {

            $("#formMessage").text(
                "This Product ID already exists. Search for it to update it."
            );

            return;
        }

        products.push(product);

        if (!saveProducts()) {
            products.pop();
            return;
        }

        selectedProductId = product.productId;

        displayJSON(product);

        $("#searchProductId").val(product.productId);

        $("#formMessage").text(
            "Product saved successfully."
        );

        $("#searchMessage").text("");

        this.reset();

    });


    // Search for a product by Product ID using jQuery.
    $("#searchButton").on("click", function() {

        let productId = $("#searchProductId").val().trim();

        if (productId === "") {

            $("#searchMessage").text(
                "Please enter a Product ID."
            );

            return;
        }

        let product = findProduct(productId);

        if (!product) {

            selectedProductId = "";

            $("#jsonOutput").text("");

            $("#searchMessage").text(
                "Product not found. Save the product first."
            );

            return;
        }

        selectedProductId = product.productId;

        // Display the selected product in the form.
        $("#productId").val(product.productId);
        $("#productDesc").val(product.productDesc);
        $("#productCategory").val(product.productCategory);
        $("#productUOM").val(product.productUOM);
        $("#productPrice").val(product.productPrice);

        $("#productWeight").val(
            product.productWeight === undefined
                ? ""
                : product.productWeight
        );

        displayJSON(product);

        $("#searchMessage").text("Product found.");
        $("#formMessage").text("");

    });


    // Update the selected product.
    $("#updateButton").on("click", function() {

        if (selectedProductId === "") {

            $("#searchMessage").text(
                "Search for a saved product before updating it."
            );

            return;
        }

        let product = getProductFromForm();

        // Check required fields.
        if (!$("#productForm")[0].checkValidity()) {

            $("#productForm")[0].reportValidity();

            return;
        }

        // Validate price.
        if (!Number.isFinite(product.productPrice) ||
            product.productPrice < 0) {

            $("#formMessage").text(
                "Please enter a valid product price."
            );

            return;
        }

        // Validate optional weight.
        if (product.productWeight !== undefined &&
            (!Number.isFinite(product.productWeight) ||
             product.productWeight < 0)) {

            $("#formMessage").text(
                "Please enter a valid product weight."
            );

            return;
        }

        // Do not allow an existing Product ID to be reused.
        if (product.productId !== selectedProductId &&
            findProduct(product.productId)) {

            $("#formMessage").text(
                "That Product ID is already in use."
            );

            return;
        }

        let index = products.findIndex(function(item) {
            return item.productId === selectedProductId;
        });

        if (index === -1) {

            $("#formMessage").text(
                "Product not found. Search for it again."
            );

            return;
        }

        products[index] = product;

        if (!saveProducts()) {
            return;
        }

        selectedProductId = product.productId;

        $("#searchProductId").val(product.productId);

        displayJSON(product);

        $("#formMessage").text(
            "Product updated successfully."
        );

        $("#searchMessage").text("");

    });

</script>

</body>
</html>
